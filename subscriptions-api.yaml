          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/BusinessFeature"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/Invalid"
        '429':
          "$ref": "#/components/responses/Throttled"
        '500':
          "$ref": "#/components/responses/ServerError"
      parameters:
      - name: name
        in: query
        required: false
        description: Optional feature filter.
        schema:
          type: string
          enum:
          - new_subscription_system
          - subscription_discount_stacking
  "/business/features/change-status":
    post:
      operationId: changeSubscriptionFeature
      summary: Change subscription feature state
      tags:
      - Business settings
      description: >-
        Requires the write_business_features permission. Uses the existing business feature endpoint.
        new_subscription_system selects the new system for new subscriptions. subscription_discount_stacking
        controls subscription discount stacking (T13192). No resource-version header.
      x-required-scopes:
      - write_business_features
      responses:
        '200':
          description: Updated; the response is an empty JSON string.
          content:
            application/json:
              schema:
                type: string
              example: ''
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/Invalid"
        '429':
          "$ref": "#/components/responses/Throttled"
        '500':
          "$ref": "#/components/responses/ServerError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SubscriptionFeatureChange"
            example:
              name: new_subscription_system
              status: true
webhooks:
  subscriptionEvent:
    post:
      operationId: receiveSubscriptionEvent
      summary: Receive a subscription event
      tags:
      - Webhooks
      description: >-
        ShopWired POSTs to the HTTPS URL registered by the app. Register using the ordinary /webhooks
        API with use_webhooks plus the relevant subscription read permission. Verify HMAC-SHA256 over
        the exact raw body using the app signature secret. Acknowledge with HTTP 200 within five seconds
        after durably recording the delivery. Delivery may be duplicated or out of order; deduplicate
        by businessId plus event.id. A contract.updated event also covers payment-method changes; there
        is no dedicated update-session status event. Ledger events have no corresponding public ledger
        collection in this specification.
      security:
      - WebhookHmac: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SubscriptionEventEnvelope"
            example:
              timestamp: Thu, 26 Nov 2026 12:00:00 +0000
              event:
                id: 701
                businessId: 801
                createdAt: Thu, 26 Nov 2026 12:00:00 +0000
                topic: subscription_plan.updated
                subjectType: subscription_plan
                subjectId: 101
                data:
                  object:
                    id: 101
                    version: 1
                    createdAt: Thu, 26 Nov 2026 12:00:00 +0000
                    enabled: false
                    name: Monthly plan
                    interval: month
                    intervalCount: 1
      responses:
        '200':
          description: Durably accepted, including an already recorded duplicate.
        5XX:
          description: Could not durably record the event; delivery has not been acknowledged.
  webhookVerification:
    post:
      operationId: verifySubscriptionWebhookUrl
      summary: Verify the registered webhook URL
      tags:
      - Webhooks
      description: >-
        Delivered to the same registered URL. Verify the raw-body signature, then return the hex HMAC-SHA256
        of verificationToken using the app signature secret as plain text.
      security:
      - WebhookHmac: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/WebhookVerification"
      responses:
        '200':
          description: Verification response.
          content:
            text/plain:
              schema:
                type: string
                pattern: "^[a-fA-F0-9]{64}$"
components:
  securitySchemes:
    OAuthBearer:
      type: http
      scheme: bearer
      description: >-
        ShopWired business OAuth access token, sent as Authorization: Bearer <token>. Subscription permissions
        are OAuth-only; Basic authentication is not supported. Obtain the scopes listed by each operation.
    WebhookHmac:
      type: apiKey
      in: header
      name: X-ShopWired-Signature
      description: >-
        64 hexadecimal characters: HMAC-SHA256 of exact raw request bytes with the app signature secret.
        Must be recomputed and securely compared; this is not a static API key.
  parameters:
    Version:
      name: X-ShopWired-Resource-Version
      in: header
      required: true
      description: Latest version from a GET of this exact resource. Missing/stale versions return 422,
        not 409.
      schema:
        "$ref": "#/components/schemas/Id"
    plan_id:
      name: plan_id
      in: path
      required: true
      description: ShopWired plan id.
      schema:
        "$ref": "#/components/schemas/Id"
    contract_id:
      name: contract_id
      in: path
      required: true
      description: ShopWired contract id.
      schema:
        "$ref": "#/components/schemas/Id"
    renewal_intent_id:
      name: renewal_intent_id
      in: path
      required: true
      description: ShopWired renewal intent id.
      schema:
        "$ref": "#/components/schemas/Id"
    id:
      name: id
      in: path
      required: true
      description: ShopWired id.
      schema:
        "$ref": "#/components/schemas/Id"
    Count:
      name: count
      in: query
      required: false
      description: Maximum records per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      description: Number of records to skip.
      schema:
        type: integer
        minimum: 0
        default: 0
    Fields:
      name: fields
      in: query
      required: false
      description: Comma-separated response fields. Schema required properties describe an unprojected
        response.
      schema:
        type: string
    SinceId:
      name: since_id
      in: query
      required: false
      description: Only IDs greater than this value.
      schema:
        type: integer
        minimum: 1
    CreatedBefore:
      name: created_before
      in: query
      required: false
      description: >-
        Creation timestamp filter in ISO 8601 with offset, for example 2026-11-26T12:00:00+00:00. URL-encode
        the plus sign.
      schema:
        type: string
        format: date-time
    CreatedAfter:
      name: created_after
      in: query
      required: false
      description: >-
        Creation timestamp filter in ISO 8601 with offset, for example 2026-11-26T12:00:00+00:00. URL-encode
        the plus sign.
      schema:
        type: string
        format: date-time
    Sort:
      name: sort
      in: query
      required: false
      description: Creation-time ordering; omitted uses the Platform default.
      schema:
        type: string
        enum:
        - created
        - created_asc
        - created_desc
    CompletedSort:
      name: sort
      in: query
      required: false
      description: Creation or completion ordering.
      schema:
        type: string
        enum:
        - created
        - created_asc
        - created_desc
        - completed
        - completed_asc
        - completed_desc
  responses:
    Unauthorized:
      description: Missing, expired or invalid OAuth access token.
    Forbidden:
      description: Required permission is missing or access to this business is forbidden.
    NotFound:
      description: Resource or parent not found in the authenticated business.
    Invalid:
      description: Invalid field, duplicate key, invalid state, locked contract or stale/missing resource
        version.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiError"
          example:
            code: 10
            message: Invalid operation
    Throttled:
      description: Rate limit exceeded. The response may have no JSON body. Retry reads with bounded backoff.
    ServerError:
      description: Server error. A mutation may already have taken effect; reconcile its outcome before
        retrying.
  schemas:
    Id:
      type: integer
      description: Positive ShopWired resource identifier or version.
      minimum: 1
    Timestamp:
      type: string
      description: RFC 1123 date, with explicit timezone offset; not an ISO 8601 date-time.
      example: Thu, 26 Nov 2026 12:00:00 +0000
    Money:
      type: number
      description: Amount in major currency units, not pence/cents. Currency comes from the contract.
      minimum: 0
    Interval:
      type: string
      description: Use day with intervalCount 7 for weekly billing.
      enum:
      - day
      - month
      - year
    ContractStatus:
      type: string
      enum:
      - pending
      - active
      - paused
      - cancelled
    ContractItemStatus:
      type: string
      enum:
      - active
      - paused
      - cancelled
    RenewalIntentStatus:
      type: string
      enum:
      - pending
      - in_progress
      - awaiting_order
      - successful
      - failed
    BillingAttemptStatus:
      type: string
      enum:
      - pending
      - requires_capture
      - requires_customer_action
      - successful
      - failed
    ChargeStatus:
      type: string
      enum:
      - pending
      - successful
      - failed
    Count:
      type: object
      required:
      - count
      properties:
        count:
          type: integer
          minimum: 0
    ApiError:
      type: object
      description: >-
        ShopWired validation/operation error. Infrastructure and authentication errors may have another
        body or no body.
      required:
      - code
      - message
      properties:
        code:
          type: integer
        message:
          type: string
    IdempotencyKey:
      type: string
      description: >-
        Required caller-generated key, unique per business and resource family. Reuse is rejected; it
        does not replay the original response. Not returned on resource reads. Maximum 64 UTF-8 bytes;
        maxLength alone does not enforce the byte limit.
      minLength: 1
      maxLength: 64
    FailResource:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          description: Only failed is available as an external status transition.
          enum:
          - failed
        failureReason:
          type: string
          description: >-
            Optional nonempty reason; omitted defaults to an empty reason. Maximum 100 UTF-8 bytes; maxLength
            alone does not enforce the byte limit.
          minLength: 1
          maxLength: 100
    PlanWrite:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: Defaults to false on creation.
        name:
          type: string
          description: Trimmed plan name. Maximum 100 UTF-8 bytes; maxLength alone does not enforce the
            byte limit.
          minLength: 1
          maxLength: 100
        interval:
          "$ref": "#/components/schemas/Interval"
        intervalCount:
          type: integer
          description: Defaults to 1 on creation.
          minimum: 1
          maximum: 9999
        cycleLimit:
          type: integer
          description: Zero means no cycle limit; defaults to zero.
          minimum: 0
          maximum: 9999
        trialDays:
          type: integer
          description: Free-trial duration in days; zero means no trial.
          minimum: 0
          maximum: 999
        priceModifierType:
          type: string
          description: Defaults to none. When explicitly set to a non-none value, priceModifierValue is
            required.
          enum:
          - none
          - fixed_price
          - percent_discount
        priceModifierValue:
          type: number
          description: >-
            Required with an explicit non-none modifier. Positive; percent_discount maximum 100; fixed_price
            maximum 9999999999. Rounded to four decimal places. Fixed-price values exclude VAT.
          exclusiveMinimum: 0
          maximum: 9999999999
      allOf:
      - if:
          properties:
            priceModifierType:
              const: percent_discount
          required:
          - priceModifierType
        then:
          required:
          - priceModifierValue
          properties:
            priceModifierValue:
              maximum: 100
      - if:
          properties:
            priceModifierType:
              const: fixed_price
          required:
          - priceModifierType
        then:
          required:
          - priceModifierValue
    PlanCreate:
      allOf:
      - "$ref": "#/components/schemas/PlanWrite"
      - required:
        - name
        - interval
      description: Create a plan. Supply priceModifierValue when selecting fixed_price or percent_discount.
    Plan:
      type: object
      description: >-
        Null optional properties are omitted. With fields projection, only requested properties are returned.
      required:
      - id
      - version
      - enabled
      - name
      - interval
      - intervalCount
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        createdAt:
          "$ref": "#/components/schemas/Timestamp"
        version:
          "$ref": "#/components/schemas/Id"
        enabled:
          type: boolean
        name:
          type: string
          description: Trimmed plan name. Maximum 100 UTF-8 bytes; maxLength alone does not enforce the
            byte limit.
          minLength: 1
          maxLength: 100
        interval:
          "$ref": "#/components/schemas/Interval"
        intervalCount:
          type: integer
          minimum: 1
          maximum: 9999
        cycleLimit:
          type: integer
          minimum: 0
          maximum: 9999
        trialDays:
          type: integer
          minimum: 0
          maximum: 999
        priceModifierType:
          type: string
          enum:
          - none
          - fixed_price
          - percent_discount
        priceModifierValue:
          type: number
          exclusiveMinimum: 0
          maximum: 9999999999
        items:
          type: array
          description: Included with embed=items; limited to 100 embedded items. Use the items collection
            to paginate.
          items:
            "$ref": "#/components/schemas/PlanItem"
    PlanItemCreate:
      type: object
      additionalProperties: false
      required:
      - productId
      - sku
      properties:
        productId:
          "$ref": "#/components/schemas/Id"
        sku:
          type: string
          description: >-
            Nonempty product/variation SKU. Product must exist in this business; the product/SKU link
            must be unique within the plan. Maximum 128 UTF-8 bytes; maxLength alone does not enforce
            the byte limit.
          minLength: 1
          maxLength: 128
    PlanItem:
      type: object
