          minLength: 0
          maxLength: 128
        emailAddress:
          type: string
          description: Maximum 128 UTF-8 bytes; maxLength alone does not enforce the byte limit.
          minLength: 0
          maxLength: 128
        phoneNumber:
          type: string
          description: Maximum 128 UTF-8 bytes; maxLength alone does not enforce the byte limit.
          minLength: 0
          maxLength: 128
        addressLine1:
          type: string
          description: Maximum 128 UTF-8 bytes; maxLength alone does not enforce the byte limit.
          minLength: 0
          maxLength: 128
        addressLine2:
          type: string
          description: Maximum 128 UTF-8 bytes; maxLength alone does not enforce the byte limit.
          minLength: 0
          maxLength: 128
        addressLine3:
          type: string
          description: Maximum 128 UTF-8 bytes; maxLength alone does not enforce the byte limit.
