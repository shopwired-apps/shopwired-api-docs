          "$ref": "#/components/schemas/ProductDetails"
        availability:
          "$ref": "#/components/schemas/Availability"
    RenewalIntentCreate:
      type: object
      additionalProperties: false
      required:
      - contractVersion
      - idempotencyKey
      - amount
      properties:
        contractVersion:
          "$ref": "#/components/schemas/Id"
        idempotencyKey:
          "$ref": "#/components/schemas/IdempotencyKey"
        amount:
          type: number
          description: Positive amount to collect in the contract currency, in major units.
          exclusiveMinimum: 0
    RenewalIntent:
      type: object
      description: >-
        Null optional properties are omitted. With fields projection, only requested properties are returned.
      required:
      - id
      - contractId
      - status
      - amount
      - currency
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        createdAt:
          "$ref": "#/components/schemas/Timestamp"
        contractId:
          "$ref": "#/components/schemas/Id"
        status:
          "$ref": "#/components/schemas/RenewalIntentStatus"
        completedAt:
          "$ref": "#/components/schemas/Timestamp"
        amount:
          "$ref": "#/components/schemas/Money"
        currency:
          type: string
          example: GBP
        finalBillingAttemptId:
          "$ref": "#/components/schemas/Id"
        orderId:
          "$ref": "#/components/schemas/Id"
        failureReason:
          type: string
    BillingAttemptCreate:
      type: object
      additionalProperties: false
      required:
      - idempotencyKey
      properties:
        idempotencyKey:
          "$ref": "#/components/schemas/IdempotencyKey"
    BillingAttempt:
      type: object
      description: >-
        Null optional properties are omitted. With fields projection, only requested properties are returned.
      required:
      - id
      - renewalIntentId
      - status
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        createdAt:
          "$ref": "#/components/schemas/Timestamp"
        renewalIntentId:
          "$ref": "#/components/schemas/Id"
        status:
          "$ref": "#/components/schemas/BillingAttemptStatus"
        completedAt:
          "$ref": "#/components/schemas/Timestamp"
        paymentMethod:
          type: string
          description: Payment method type; no card details.
        failureReason:
          type: string
        errorCode:
          type: string
        errorDescription:
          type: string
    StandaloneChargeCreate:
      type: object
      additionalProperties: false
      required:
      - idempotencyKey
      - amount
      - description
      properties:
        idempotencyKey:
          "$ref": "#/components/schemas/IdempotencyKey"
        amount:
          type: number
          description: Positive major-unit amount in the contract currency.
          exclusiveMinimum: 0
        description:
          type: string
          description: Maximum 1000 UTF-8 bytes; maxLength alone does not enforce the byte limit.
          minLength: 1
          maxLength: 1000
    StandaloneCharge:
      type: object
      description: >-
        Null optional properties are omitted. With fields projection, only requested properties are returned.
      required:
      - id
      - contractId
      - status
      - amount
      - currency
      - description
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        createdAt:
          "$ref": "#/components/schemas/Timestamp"
        contractId:
          "$ref": "#/components/schemas/Id"
        status:
          "$ref": "#/components/schemas/ChargeStatus"
        amount:
          "$ref": "#/components/schemas/Money"
        currency:
          type: string
          example: GBP
        description:
          type: string
        paymentMethod:
          type: string
        failureReason:
          type: string
    PaymentMethodUpdateSession:
      type: object
      description: >-
        Single-use redirect token, expires after five minutes. No session ID or status lookup. Hosted
        page shows success/failure; a saved method emits subscription_contract.updated.
      required:
      - url
      - expiresAt
      properties:
        url:
          type: string
          description: Open the Platform-hosted page to update the saved method.
          format: uri
        expiresAt:
          "$ref": "#/components/schemas/Timestamp"
    BusinessFeature:
      type: object
      required:
      - name
      - enabled
      properties:
        name:
          type: string
        enabled:
          type: boolean
    SubscriptionFeatureChange:
      type: object
      additionalProperties: false
      required:
      - name
      - status
      properties:
        name:
          type: string
          enum:
          - new_subscription_system
          - subscription_discount_stacking
        status:
          type: boolean
    SubscriptionBusiness:
      type: object
      description: >-
        Subscription-related fields of the ordinary business resource; other business fields may also
        be present.
      required:
      - id
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        settings:
          type: object
          properties:
            subscriptionSystemVersion:
              type: integer
              description: Version 2 identifies the new system. Older implementations omit the property
                for version 1.
            subscriptionDiscountStacking:
              type: boolean
              description: Whether subscription discounts may stack; returned with embed=settings.
    RenewalOrderSubscriptionFields:
      type: object
      description: >-
        Supplement to the ordinary POST /orders body, not a complete order request. Keep these request
        fields after T13192; add ordinary products, addresses and shipping fields. Product lines belonging
        to the subscription use subscriptionPlanItem. Platform does not guarantee equality between the
        intent amount and final order total.
      required:
      - subscriptionContractId
      - subscriptionContractVersion
      - subscriptionRenewalIntentId
      - subscriptionBillingAttemptId
      properties:
        subscriptionContractId:
          "$ref": "#/components/schemas/Id"
        subscriptionContractVersion:
          "$ref": "#/components/schemas/Id"
        subscriptionRenewalIntentId:
          "$ref": "#/components/schemas/Id"
        subscriptionBillingAttemptId:
          "$ref": "#/components/schemas/Id"
    SubscriptionOrderReadFields:
      type: object
      description: >-
        Supplement to ordinary order responses. T13192 replaces the read-side subscriptionContractId with
        hasSubscriptionContracts. For identity use contract.initialOrderId or renewalIntent.contractId/orderId.
      required:
      - id
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        hasSubscriptionContracts:
          type: boolean
    SubscriptionEvent:
      type: object
      required:
      - id
      - businessId
      - topic
      - subjectType
      - subjectId
      - data
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        businessId:
          "$ref": "#/components/schemas/Id"
        createdAt:
          "$ref": "#/components/schemas/Timestamp"
        topic:
          type: string
          enum:
          - subscription_plan.created
          - subscription_plan.updated
          - subscription_plan.deleted
          - subscription_plan_item.created
          - subscription_plan_item.deleted
          - subscription_contract.created
          - subscription_contract.updated
          - subscription_contract.deleted
          - subscription_contract_item.created
          - subscription_contract_item.updated
          - subscription_contract_item.deleted
          - subscription_renewal_intent.created
          - subscription_renewal_intent.updated
          - subscription_renewal_intent.deleted
          - subscription_billing_attempt.created
          - subscription_billing_attempt.updated
          - subscription_billing_attempt.deleted
          - subscription_billing_attempt.error
          - subscription_ledger_entry.created
          - subscription_standalone_charge.created
        subjectType:
          type: string
          enum:
          - subscription_plan
          - subscription_plan_item
          - subscription_contract
          - subscription_contract_item
          - subscription_renewal_intent
          - subscription_billing_attempt
          - subscription_ledger_entry
          - subscription_standalone_charge
        subjectId:
          "$ref": "#/components/schemas/Id"
        data:
          type: object
          description: Event data; do not assume every event is a full current resource.
          properties:
            object:
              type: object
              description: >-
                Topic-specific resource snapshot. Deletion/error payloads can differ from a fresh GET.
                Refresh the corresponding resource when present.
              properties: {}
    SubscriptionEventEnvelope:
      type: object
      required:
      - timestamp
      - event
      properties:
        timestamp:
          "$ref": "#/components/schemas/Timestamp"
        event:
          "$ref": "#/components/schemas/SubscriptionEvent"
    WebhookVerification:
      type: object
      required:
      - timestamp
      - verificationToken
      properties:
        timestamp:
          "$ref": "#/components/schemas/Timestamp"
        verificationToken:
          type: string
