info:
  title: ShopWired Subscriptions API
  version: 1.0.0
  description: |-
    Subscription plans, contracts, renewal intents, billing attempts, standalone charges,
    payment-method update links, related business settings, and subscription webhooks.

    All resource IDs are ShopWired IDs scoped to the authenticated business. JSON request
    bodies are used for writes. Optional null resource fields are normally omitted.
    Amounts use major currency units; prices on contract items exclude VAT. Timestamps
    in resources use RFC 1123; creation-date query filters use ISO 8601.

    Use X-ShopWired-Resource-Version only where the operation declares it: plan PUT/DELETE,
    contract PUT and contract-item PUT. Plan items, renewal intents, billing attempts and
    standalone charges are not versioned. Creating a renewal intent instead requires the
    latest parent contractVersion in the body. Child operations can change the parent
    contract version. Re-read before subsequent versioned writes.

    Idempotency keys reject reuse; they do not provide replay or exact-key lookup. Persist
    keys and returned IDs. On an uncertain mutation response, reconcile before retrying.
    HTTP 201 on a billing attempt or standalone charge means the resource was created;
    inspect status for the payment outcome. Per T13166, Platform can report provider/API
    errors and timeouts as failed; no separate certainty or provider-reference fields
    were agreed. The specification does not invent such fields.

    The existing basket API supplies subscription-change quotes (up to 50 basket items),
    including applicable shipping/VAT. It is not a new subscription endpoint. Renewal
    orders use the ordinary order API plus RenewalOrderSubscriptionFields. After T13192,
    order responses use hasSubscriptionContracts; the request still needs
    subscriptionContractId and the other subscription references.

    Prepared 26 November 2026 from inspected Platform snapshots, application integration
    evidence, and supplied final decisions in T12346, T13100, T13166 and T13192. Later task
    decisions override the older snapshots for settings and order reads. This document
    is not a fresh acceptance test of every live endpoint. See the companion README
    for provenance and the remaining verification limits.
